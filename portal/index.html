<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal del equipo · Elderly</title>
<link rel="stylesheet" href="/motion/fx.css">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('elderly_theme')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
</head>
<body>
<style>
  :root{
    --ground:#EEF0EA; --surface:#FBFCF9; --surface-2:#F4F6F1;
    --ink:#16211C; --ink-soft:#3B4842; --muted:#67756C; --line:#DBDFD6;
    --rail:#173B31; --rail-2:#12302708; --rail-ink:#E7E0D0; --rail-ink-soft:#A9C0B4; --rail-line:#2A5245;
    --primary:#1D4A3E; --primary-ink:#F1ECDE; --accent:#E07E39; --accent-soft:#F5E6D6;
    --good:#2E7D5B; --good-bg:#E4F0E9; --warn:#B9812A; --warn-bg:#F6ECD8; --crit:#C4553B; --crit-bg:#F6E2DB;
    --shadow:0 1px 2px rgba(20,40,32,.06),0 8px 24px rgba(20,40,32,.06);
    --radius:14px; --radius-sm:9px;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0E1512; --surface:#16211C; --surface-2:#1B2A24;
      --ink:#EAE7DC; --ink-soft:#C3CCC4; --muted:#8C9A90; --line:#26362E;
      --rail:#0C1B16; --rail-ink:#E7E0D0; --rail-ink-soft:#95AEA1; --rail-line:#1E3A30;
      --primary:#4FA587; --primary-ink:#0E1512; --accent:#EA8C4B; --accent-soft:#2A2016;
      --good:#5CBF92; --good-bg:#153126; --warn:#D9A648; --warn-bg:#2E2513; --crit:#E07B60; --crit-bg:#331E17;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --ground:#EEF0EA; --surface:#FBFCF9; --surface-2:#F4F6F1;
    --ink:#16211C; --ink-soft:#3B4842; --muted:#67756C; --line:#DBDFD6;
    --rail:#173B31; --rail-ink:#E7E0D0; --rail-ink-soft:#A9C0B4; --rail-line:#2A5245;
    --primary:#1D4A3E; --primary-ink:#F1ECDE; --accent:#E07E39; --accent-soft:#F5E6D6;
    --good:#2E7D5B; --good-bg:#E4F0E9; --warn:#B9812A; --warn-bg:#F6ECD8; --crit:#C4553B; --crit-bg:#F6E2DB;
    --shadow:0 1px 2px rgba(20,40,32,.06),0 8px 24px rgba(20,40,32,.06);
  }
  :root[data-theme="dark"]{
    --ground:#0E1512; --surface:#16211C; --surface-2:#1B2A24;
    --ink:#EAE7DC; --ink-soft:#C3CCC4; --muted:#8C9A90; --line:#26362E;
    --rail:#0C1B16; --rail-ink:#E7E0D0; --rail-ink-soft:#95AEA1; --rail-line:#1E3A30;
    --primary:#4FA587; --primary-ink:#0E1512; --accent:#EA8C4B; --accent-soft:#2A2016;
    --good:#5CBF92; --good-bg:#153126; --warn:#D9A648; --warn-bg:#2E2513; --crit:#E07B60; --crit-bg:#331E17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--accent);color:#fff}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 90% at 50% -10%, #1f5344 0%, var(--rail) 55%, #0d241d 100%)}
  .login-card{width:100%;max-width:410px;background:var(--surface);border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
  .login-head{padding:34px 34px 6px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:11px;margin-bottom:20px}
  .brand .word{font-weight:800;font-size:22px;letter-spacing:-.03em}
  .brand .word b{color:var(--accent);font-weight:800}
  .login-head h1{font-size:21px}
  .login-head p{color:var(--muted);font-size:14px;margin:7px 0 0}
  .seg{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin:22px 34px 0}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;
    padding:9px;border-radius:8px;transition:.15s}
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .login-body{padding:22px 34px 34px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.05em}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:10px;font-size:14.5px;font-family:inherit;transition:.15s}
  .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
  .btn{width:100%;border:0;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:15px;
    padding:13px;border-radius:11px;transition:.15s;box-shadow:var(--shadow)}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .login-err{color:var(--crit);font-size:13px;margin:0 0 12px;min-height:18px;font-weight:600}
  .soon{text-align:center;padding:14px 4px 4px;color:var(--muted);font-size:14px}
  .soon b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  .switch{text-align:center;font-size:13px;color:var(--muted);margin:15px 0 0}
  .switch a{color:var(--primary);font-weight:700;text-decoration:none}
  .switch a:hover{text-decoration:underline}
  .login-foot{text-align:center;color:var(--rail-ink-soft);font-size:12.5px;margin-top:20px}

  /* ---------- APP SHELL ---------- */
  .app{display:none;min-height:100vh;grid-template-columns:256px 1fr}
  .app.on{display:grid}
  @media(max-width:820px){.app.on{grid-template-columns:1fr}}

  .rail{background:var(--rail);color:var(--rail-ink);padding:22px 16px;display:flex;flex-direction:column;
    gap:6px;position:sticky;top:0;height:100vh}
  @media(max-width:820px){.rail{position:static;height:auto}}
  .rail .brand{padding:4px 8px 18px;margin:0}
  .rail .brand .word{color:var(--rail-ink)}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;
    color:var(--rail-ink-soft);font-weight:600;font-size:14.5px;padding:11px 12px;border-radius:10px;
    text-align:left;transition:.15s}
  .nav button svg{width:18px;height:18px;flex:none;opacity:.9}
  .nav button:hover{background:#ffffff10;color:var(--rail-ink)}
  .nav button.active{background:var(--accent);color:#fff}
  .nav button.active svg{opacity:1}
  .rail-foot{border-top:1px solid var(--rail-line);padding-top:14px;display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;
    place-items:center;font-weight:700;font-size:14px;flex:none}
  .rail-foot .who{flex:1;min-width:0}
  .rail-foot .who b{display:block;font-size:13.5px;color:var(--rail-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-foot .who span{font-size:11.5px;color:var(--rail-ink-soft)}
  .icon-btn{border:0;background:#ffffff12;color:var(--rail-ink);width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;transition:.15s}
  .icon-btn:hover{background:#ffffff20}
  .icon-btn svg{width:17px;height:17px}

  /* ---------- MAIN ---------- */
  main{padding:30px 34px 60px;max-width:1100px;width:100%}
  @media(max-width:560px){main{padding:22px 18px 50px}}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .page-head h1{font-size:27px}
  .page-head p{color:var(--muted);font-size:14px;margin:6px 0 0}
  .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:8px}
  .view{display:none}
  .view.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.view.on{animation:none}}

  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:4px}

  .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}
  .section-title h2{font-size:18px}
  .section-title:first-child{margin-top:0}

  /* table */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:700;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-soft)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td .pname{font-weight:700;color:var(--ink)}
  td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-family:var(--mono);color:var(--ink)}
  [contenteditable]{outline:none;border-radius:5px;transition:.12s;min-width:20px}
  [contenteditable]:hover{box-shadow:inset 0 0 0 1px var(--line)}
  [contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--primary);background:var(--surface)}
  .mono{font-family:var(--mono)}
  .email{font-family:var(--mono);font-size:12.5px}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--good);background:var(--good-bg)}
  .pill.warn{color:var(--warn);background:var(--warn-bg)}
  .pill.crit{color:var(--crit);background:var(--crit-bg)}
  .pill.dev{color:var(--muted);background:var(--surface-2)}

  .rowbtn{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
  .rowbtn:hover{background:var(--crit-bg);color:var(--crit)}
  .rowbtn svg{width:15px;height:15px}
  .ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;
    padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .ghost:hover{border-color:var(--primary);color:var(--primary)}
  .ghost svg{width:15px;height:15px}

  .save-hint{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .save-hint svg{width:13px;height:13px;color:var(--good)}

  /* status list */
  .status-list{display:flex;flex-direction:column;gap:2px}
  .status-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .status-row:last-child{border-bottom:0}
  .status-row .st-name{flex:1;font-weight:600;color:var(--ink)}
  .status-row .st-desc{color:var(--muted);font-size:13px;font-weight:400;display:block;margin-top:2px}
  .dot{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center}
  .dot svg{width:13px;height:13px;color:#fff}
  .dot.done{background:var(--good)} .dot.prog{background:var(--warn)} .dot.todo{background:var(--line)}
  .dot.todo::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}

  .stack-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--line);color:var(--ink-soft)}
  .chip b{color:var(--primary)}

  /* team */
  .team-grid{grid-template-columns:repeat(3,1fr)}
  @media(max-width:720px){.team-grid{grid-template-columns:1fr}}
  .member{display:flex;gap:14px;align-items:center}
  .member .av{width:46px;height:46px;border-radius:12px;background:var(--primary);color:var(--primary-ink);
    display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
  .member .m-name{font-weight:700;color:var(--ink)}
  .member .m-role{font-size:12.5px;color:var(--accent);font-weight:600}
  .member .m-mail{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}

  textarea.notes{width:100%;min-height:280px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:var(--radius);padding:18px;font-family:inherit;font-size:14.5px;line-height:1.65;resize:vertical;box-shadow:var(--shadow)}
  textarea.notes:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}

  .banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:22px}
  .banner svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:1px}
  .banner p{margin:0;font-size:13px;color:var(--ink-soft)}
  .banner b{color:var(--ink)}
  .muted{color:var(--muted)}
</style>

<!-- ================= LOGIN ================= -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="login-head">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#1D4A3E"/><rect x="14" y="14.5" width="20" height="4.5" rx="2.25" fill="#F1ECDE"/><rect x="14" y="21.75" width="13" height="4.5" rx="2.25" fill="#E07E39"/><rect x="14" y="29" width="20" height="4.5" rx="2.25" fill="#F1ECDE"/></svg>
        <span class="word">Elder<b>ly</b></span>
      </div>
      <h1>Bienvenido</h1>
      <p>Ingresá a tu portal</p>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="true" data-tab="family">Familias</button>
      <button role="tab" aria-selected="false" data-tab="team">Equipo</button>
    </div>
    <div class="login-body">
      <!-- FAMILIAS: iniciar sesión + crear cuenta -->
      <div data-pane="family">
        <div id="famLogin">
          <p class="login-err" id="famErr"></p>
          <div class="field"><label>Email</label><input type="email" id="famEmail" placeholder="tu@email.com" autocomplete="username"></div>
          <div class="field"><label>Contraseña</label><input type="password" id="famPass" placeholder="••••••••" autocomplete="current-password"></div>
          <button class="btn" id="famLoginBtn" type="button">Iniciar sesión</button>
          <p class="switch">¿No tenés cuenta? <a href="#" id="toSignup">Creá una gratis</a></p>
        </div>
        <div id="famSignup" hidden>
          <p class="login-err" id="famErr2"></p>
          <div class="field"><label>Tu nombre</label><input type="text" id="suName" placeholder="Nombre y apellido"></div>
          <div class="field"><label>Email</label><input type="email" id="suEmail" placeholder="tu@email.com"></div>
          <div class="field"><label>Contraseña</label><input type="password" id="suPass" placeholder="Elegí una contraseña"></div>
          <button class="btn" id="famSignupBtn" type="button">Crear mi cuenta</button>
          <p class="switch">¿Ya tenés cuenta? <a href="#" id="toLogin">Iniciá sesión</a></p>
        </div>
        <div id="famDone" class="soon" hidden><b>¡Gracias!</b>Estamos activando los portales de familias. Te vamos a avisar por email apenas esté listo para vos.</div>
      </div>
      <!-- EQUIPO -->
      <form id="teamForm" data-pane="team" hidden>
        <p class="login-err" id="loginErr"></p>
        <div class="field"><label>Email</label><input type="email" id="email" placeholder="tu@heyzawo.com" autocomplete="username"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"></div>
        <button class="btn" type="submit">Entrar al panel</button>
      </form>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="9" width="26" height="6" rx="3" fill="#F1ECDE"/><rect x="6" y="19" width="17" height="6" rx="3" fill="#E07E39"/><rect x="6" y="29" width="26" height="6" rx="3" fill="#F1ECDE"/></svg>
      <span class="word">Elder<b style="color:#E07E39">ly</b></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="avatar" id="uAvatar">M</div>
      <div class="who"><b id="uName">Matías</b><span>Equipo</span></div>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
      <button class="icon-btn" id="logout" title="Salir" aria-label="Salir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<script>

  "use strict";
  var KEY="elderly_admin_v1";

      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  }
  var savedTheme="light";try{savedTheme=localStorage.getItem("elderly_theme")||"light"}catch(e){}

  /* ---- seed data ---- */
  var SEED={
    platforms:[
      {name:"Twilio",use:"Telefonía · las llamadas",email:"",plan:"Pay as you go",cost:"",note:"Cuenta Missionary Packages · saldo US$35.63 · ~US$0.014/min US→US",status:"ok"},

      {name:"OpenAI",use:"LLM · el cerebro",email:"matias@heyzawo.com",plan:"Pay as you go",cost:"",note:"Cargados US$10 · gpt-4o-mini",status:"ok"},
      {name:"Cartesia",use:"Text-to-speech · la voz",email:"matias@heyzawo.com",plan:"Free credits",cost:"0",note:"Cuenta ZAWO · crédito gratis (se agotó parcial)",status:"ok"},
      {name:"Vercel",use:"Hosting de la web",email:"matias@heyzawo.com",plan:"Hobby (free)",cost:"0",note:"Sirve callelderly.com y heyzawo.com",status:"ok"},
      {name:"GoDaddy",use:"Dominio callelderly.com",email:"matias@heyzawo.com",plan:"Registro anual",cost:"",note:"~US$20/año (dividir /12 para mensual)",status:"ok"},
      {name:"GitHub",use:"Código de la web",email:"matias@heyzawo.com",plan:"Free",cost:"0",note:"repo hey-zawo",status:"ok"},
      {name:"ngrok",use:"Túnel para pruebas de llamadas",email:"matias@heyzawo.com",plan:"Free",cost:"0",note:"Solo desarrollo local",status:"dev"}
    ],
    team:[
      {name:"Matías",email:"matias@heyzawo.com",role:"Co-fundador"},
      {name:"Pablo",email:"pablo@heyzawo.com",role:"Co-fundador"},
      {name:"Belén",email:"",role:"Socia"}
    ],
    notes:"Notas del equipo — anotá acá decisiones, pendientes, ideas.\n\n• 24/07 — MVP de llamadas telefónicas funcionando. Probado con Matías, Pablo y Belén: a los tres les encantó.\n• Aprendizaje: conviene llamar desde el número propio de Twilio (+1 385 233-9455), no desde el caller ID verificado (lo filtran como spam).\n• Voces elegidas: Jorge (ES hombre), Mariana (ES mujer), Nolan (EN hombre), Rory (EN mujer). Velocidad 1.15.\n• Pendiente: reporte a la familia, llamadas agendadas, onboarding web."
  };

  var data;
  function load(){try{var s=localStorage.getItem(KEY);data=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));}catch(e){data=JSON.parse(JSON.stringify(SEED));}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));flashSaved();}catch(e){}}
  var savedTimer;
  function flashSaved(){var h=document.querySelectorAll(".save-live");h.forEach(function(n){n.textContent="Guardado";n.style.opacity="1";});clearTimeout(savedTimer);savedTimer=setTimeout(function(){h.forEach(function(n){n.style.opacity=".55"})},1400);}

  /* ---- icons ---- */
  var I={
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
    cost:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>',
    rocket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2M9 12l3 3M12 3c4 2 6 6 6 10l-4 2-6-6 2-4c1.5-1.5 2 0 2-2z"/><circle cx="14.5" cy="9.5" r="1.3"/></svg>',
    team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.9M17 20a5.5 5.5 0 0 0-2.5-4.6"/></svg>',
    note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v14H5z"/><path d="M15 3v5h5M8.5 13h7M8.5 17h7"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
  };

  var PAGES=[
    {id:"resumen",label:"Resumen",icon:"home"},
    {id:"costos",label:"Costos y plataformas",icon:"cost"},
    {id:"producto",label:"Estado del producto",icon:"rocket"},
    {id:"equipo",label:"Equipo",icon:"team"},
    {id:"notas",label:"Notas",icon:"note"}
  ];

  /* ---- helpers ---- */
  function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function num(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n}
  function money(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}

  function monthlyTotal(){var t=0;data.platforms.forEach(function(p){t+=num(p.cost)});return t}
  function usageCount(){return data.platforms.filter(function(p){return String(p.cost).trim()===""}).length}

  /* ---- renderers ---- */
  function pageHead(eyebrow,title,sub){
    return '<div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div><span class="save-hint save-live" style="opacity:.55">'+I.check+'Se guarda en tu navegador</span></div>';
  }

  function viewResumen(){
    var total=monthlyTotal(), usage=usageCount(), active=data.platforms.filter(function(p){return p.status==="ok"}).length;
    return pageHead("Panel interno","Resumen","Todo lo importante del proyecto, en un vistazo.")+
    '<div class="grid kpis">'+
      kpi("Costo fijo / mes","US$ "+money(total),"suma de planes con precio fijo")+
      kpi("Servicios por uso",String(usage),"pagan según consumo (llamadas, IA)")+
      kpi("Plataformas activas",String(active),"de "+data.platforms.length+" en total")+
      kpi("MVP","Llamando ✓","las llamadas de voz funcionan")+
    '</div>'+
    '<div class="section-title"><h2>Dónde estamos</h2></div>'+
    '<div class="card"><div class="stack-chips">'+
      '<span class="chip"><b>Web</b> callelderly.com live (ES/EN)</span>'+
      '<span class="chip"><b>Llamadas</b> voz IA real, probada</span>'+
      '<span class="chip"><b>Voces</b> catálogo listo para elegir</span>'+
      '<span class="chip"><b>Próximo</b> reporte a la familia</span>'+
    '</div></div>'+
    '<div class="section-title"><h2>Accesos rápidos</h2></div>'+
    '<div class="grid" style="grid-template-columns:repeat(2,1fr)">'+
      linkCard("Costos y plataformas","Qué usamos, con qué correo y cuánto pagamos.","costos")+
      linkCard("Estado del producto","Qué está listo y qué sigue en el MVP.","producto")+
    '</div>';
  }
  function kpi(l,v,s){return '<div class="card kpi"><div class="lbl">'+l+'</div><div class="val">'+v+'</div><div class="sub">'+s+'</div></div>'}
  function linkCard(t,d,go){return '<button class="card" data-go="'+go+'" style="text-align:left;cursor:pointer;border-color:var(--line)"><div style="font-weight:700;margin-bottom:5px">'+t+'</div><div class="muted" style="font-size:13px">'+d+'</div></button>'}

  function viewCostos(){
    var rows=data.platforms.map(function(p,i){
      var st=p.status==="ok"?'<span class="pill ok">Activo</span>':p.status==="dev"?'<span class="pill dev">Dev</span>':'<span class="pill warn">Revisar</span>';
      return '<tr data-i="'+i+'">'+
        '<td><span class="pname" contenteditable data-f="name">'+esc(p.name)+'</span><div class="muted" style="font-size:12px;margin-top:2px" contenteditable data-f="use">'+esc(p.use)+'</div></td>'+
        '<td class="email" contenteditable data-f="email">'+esc(p.email||"—")+'</td>'+
        '<td contenteditable data-f="plan">'+esc(p.plan)+'</td>'+
        '<td class="num"><span contenteditable data-f="cost">'+esc(p.cost)+'</span></td>'+
        '<td>'+st+'</td>'+
        '<td class="muted" style="font-size:12.5px;min-width:180px" contenteditable data-f="note">'+esc(p.note)+'</td>'+
        '<td><button class="rowbtn" data-del="'+i+'" title="Quitar">'+I.trash+'</button></td>'+
      '</tr>';
    }).join("");
    return pageHead("Cuentas","Costos y plataformas","Todo lo que usamos hoy. Tocá cualquier celda para editarla. El costo va en dólares por mes (dejalo vacío si es por uso).")+
    '<div class="banner">'+I.info+'<p><b>El costo fuerte hoy es Twilio</b>, y solo porque probamos llamando a Argentina. En el mercado real (familias en US llamando a padres en US) la telefonía es baratísima (~US$0.014/min). El resto son créditos gratis o planes free.</p></div>'+
    '<div class="tbl-wrap"><table><thead><tr>'+
      '<th>Plataforma</th><th>Email de acceso</th><th>Plan</th><th style="text-align:right">US$/mes</th><th>Estado</th><th>Notas</th><th></th>'+
    '</tr></thead><tbody id="costBody">'+rows+'</tbody></table></div>'+
    '<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
      '<button class="ghost" id="addRow">'+I.plus+'Agregar plataforma</button>'+
      '<span class="save-hint save-live" style="opacity:.55">'+I.check+'Se guarda en tu navegador</span>'+
    '</div>';
  }

  function viewProducto(){
    var steps=[
      ["done","Web pública","callelderly.com en español e inglés, con la marca Elderly."],
      ["done","Llamadas de voz (IA)","Elderly llama a un teléfono real y conversa. Probado con el equipo."],
      ["prog","Selección de voces","Catálogo de 352 voces descargado; eligiendo las finalistas."],
      ["todo","Reporte a la familia","Resumen por email después de cada llamada (ánimo, salud, estafas)."],
      ["todo","Llamadas agendadas","Que las llamadas salgan solas a una hora fija cada día."],
      ["todo","Onboarding de familias","Alta web: la familia carga a su ser querido y elige voz y horario."],
      ["todo","Portal de familias","Cada familia entra a ver sus reportes y configurar."]
    ];
    var list=steps.map(function(s){
      var d=s[0]==="done"?'<span class="dot done">'+I.check+'</span>':s[0]==="prog"?'<span class="dot prog">'+I.clock+'</span>':'<span class="dot todo"></span>';
      var tag=s[0]==="done"?'<span class="pill ok">Listo</span>':s[0]==="prog"?'<span class="pill warn">En curso</span>':'<span class="pill dev">Pendiente</span>';
      return '<div class="status-row">'+d+'<div class="st-name">'+s[1]+'<span class="st-desc">'+s[2]+'</span></div>'+tag+'</div>';
    }).join("");
    return pageHead("Producto","Estado del producto","El camino del MVP: qué está listo y qué sigue.")+
    '<div class="card"><div class="status-list">'+list+'</div></div>'+
    '<div class="section-title"><h2>Cómo está hecho (stack)</h2></div>'+
    '<div class="card"><p class="muted" style="margin:0 0 12px;font-size:13.5px">Cada llamada pasa por estas piezas, en orden:</p><div class="stack-chips">'+
      '<span class="chip"><b>Twilio</b> teléfono</span>'+
      '<span class="chip"><b>Deepgram</b> oído (voz→texto)</span>'+
      '<span class="chip"><b>OpenAI</b> cerebro (qué responder)</span>'+
      '<span class="chip"><b>Cartesia</b> voz (texto→voz)</span>'+
      '<span class="chip"><b>Pipecat</b> orquesta todo</span>'+
    '</div></div>';
  }

  function viewEquipo(){
    var cards=data.team.map(function(m,i){
      var ini=(m.name||"?").trim().charAt(0).toUpperCase();
      return '<div class="card member" data-ti="'+i+'"><div class="av">'+ini+'</div><div style="min-width:0"><div class="m-name" contenteditable data-tf="name">'+esc(m.name)+'</div><div class="m-role" contenteditable data-tf="role">'+esc(m.role)+'</div><div class="m-mail" contenteditable data-tf="email">'+esc(m.email||"—")+'</div></div></div>';
    }).join("");
    return pageHead("Personas","Equipo","Quiénes somos y con qué correo entramos.")+
    '<div class="grid team-grid">'+cards+'</div>'+
    '<div class="banner" style="margin-top:22px">'+I.info+'<p>Cuando montemos el backend, cada persona va a tener su <b>login propio</b> con su email y contraseña, y estos datos van a ser <b>compartidos</b> (los tres ven lo mismo en vivo).</p></div>';
  }

  function viewNotas(){
    return pageHead("Bitácora","Notas","Decisiones, pendientes e ideas del equipo.")+
    '<textarea class="notes" id="notesArea" spellcheck="false">'+esc(data.notes)+'</textarea>'+
    '<div style="margin-top:10px"><span class="save-hint save-live" style="opacity:.55">'+I.check+'Se guarda en tu navegador</span></div>';
  }

  var VIEWS={resumen:viewResumen,costos:viewCostos,producto:viewProducto,equipo:viewEquipo,notas:viewNotas};

  function render(page){
    el("main").innerHTML='<div class="view on">'+VIEWS[page]()+'</div>';
    document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("active",b.dataset.page===page)});
    wire(page);
    try{localStorage.setItem("elderly_admin_page",page)}catch(e){}
  }

  function wire(page){
    document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
    if(page==="costos"){
      document.querySelectorAll("#costBody [contenteditable]").forEach(function(c){
        c.addEventListener("blur",function(){var tr=c.closest("tr");data.platforms[+tr.dataset.i][c.dataset.f]=c.textContent.trim();save();});
      });
      document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){data.platforms.splice(+b.dataset.del,1);save();render("costos")}});
      var add=el("addRow");if(add)add.onclick=function(){data.platforms.push({name:"Nueva plataforma",use:"para qué",email:"",plan:"",cost:"",note:"",status:"ok"});save();render("costos")};
    }
    if(page==="equipo"){
      document.querySelectorAll("[data-tf]").forEach(function(c){
        c.addEventListener("blur",function(){var card=c.closest("[data-ti]");data.team[+card.dataset.ti][c.dataset.tf]=c.textContent.trim();save();if(c.dataset.tf==="name")card.querySelector(".av").textContent=(c.textContent.trim()||"?").charAt(0).toUpperCase();});
      });
    }
    if(page==="notas"){
      var n=el("notesArea");n.addEventListener("input",function(){data.notes=n.value;save()});
    }
  }

  function go(page){render(page)}

  /* ---- nav build ---- */
  function buildNav(){
    el("nav").innerHTML=PAGES.map(function(p){return '<button data-page="'+p.id+'">'+I[p.icon]+'<span>'+p.label+'</span></button>'}).join("");
    document.querySelectorAll("#nav button").forEach(function(b){b.onclick=function(){go(b.dataset.page)}});
  }

  /* ---- auth: solo los 3 del equipo. Guardamos el HASH de la contraseña, nunca el texto. ---- */
  var ACCOUNTS={
    "matias@heyzawo.com":{name:"Matías",hash:"17cba007407bd75e21d906ebfe8726853582fab39e1f03dc9bd57a2b454b47c2"},
    "pablo@heyzawo.com":{name:"Pablo",hash:"435b3265482ba13e8e83e2bab79724f04ee8e8edad9841d47d51e2bcbb0091f6"},
    "belen@heyzawo.com":{name:"Belén",hash:"952e1cce5a5f3bddc35fe0d965a2e6b7c284a320b8850a86d29e10dc01c21ff6"}
  };
  function sha256hex(s){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0")}).join("");
    });
  }
  function enter(name){
    el("login").style.display="none";
    el("app").classList.add("on");
    el("uName").textContent=name;
    el("uAvatar").textContent=name.charAt(0).toUpperCase();
    load();buildNav();
    var last="resumen";try{last=localStorage.getItem("elderly_admin_page")||"resumen"}catch(e){}
    render(VIEWS[last]?last:"resumen");
  }

  el("teamForm").addEventListener("submit",function(e){
    e.preventDefault();
    var mail=el("email").value.trim().toLowerCase(), pass=el("pass").value;
    var acc=ACCOUNTS[mail];
    if(!acc){el("loginErr").textContent="Ese email no tiene acceso al portal del equipo.";return}
    sha256hex(pass).then(function(h){
      if(h!==acc.hash){el("loginErr").textContent="Contraseña incorrecta.";return}
      el("loginErr").textContent="";
      try{sessionStorage.setItem("elderly_sess",acc.name)}catch(e2){}
      enter(acc.name);
    }).catch(function(){el("loginErr").textContent="No se pudo validar. Probá de nuevo.";});
  });

  el("logout").onclick=function(){try{sessionStorage.removeItem("elderly_sess")}catch(e){}location.reload()};
  el("themeBtn").onclick=function(){setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark")};

  /* familias: login + crear cuenta (prototipo front-end; el backend llega con los portales de familias) */
  function famShow(which){
    el("famLogin").hidden=which!=="login";
    el("famSignup").hidden=which!=="signup";
    el("famDone").hidden=which!=="done";
  }
  el("toSignup").onclick=function(e){e.preventDefault();el("famErr").textContent="";famShow("signup")};
  el("toLogin").onclick=function(e){e.preventDefault();el("famErr2").textContent="";famShow("login")};
  el("famLoginBtn").onclick=function(){
    if(!el("famEmail").value.trim()){el("famErr").textContent="Poné tu email.";return}
    famShow("done");
  };
  el("famSignupBtn").onclick=function(){
    if(!el("suName").value.trim()||!el("suEmail").value.trim()){el("famErr2").textContent="Completá tu nombre y email.";return}
    famShow("done");
  };

  /* login tabs */
  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
      document.querySelectorAll("[data-pane]").forEach(function(p){p.hidden=p.dataset.pane!==b.dataset.tab});
      if(b.dataset.tab==="family")famShow("login");
    };
  });

  /* init */
  setTheme(savedTheme);
  var sess=null;try{sess=sessionStorage.getItem("elderly_sess")}catch(e){}
  if(sess){enter(sess)}
})();
</script>
