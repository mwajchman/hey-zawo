<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Page not found · Elderly</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#01534C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    color-scheme:light;
    --teal:#01534C; --forest:#06342F; --cream:#F7F2E7; --amber:#F0913E;
    --honey:#E8B54A; --amber-dp:#C9661F; --amber-tx:#9C4B0D;
    --oat:#F0E8DA; --soft:#FBF8F1; --paper:#FFFDF8;
    --ink:#12302C; --ink-soft:rgba(18,48,44,.74);
    --rule:rgba(18,48,44,.16); --rule-c:rgba(247,242,231,.24);
    --error:#A8320F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--soft); color:var(--ink);
    font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:grid; place-items:center; padding:24px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:3px solid var(--amber-tx);outline-offset:3px}
  .card{
    background:var(--paper); border:1px solid var(--rule); border-radius:28px;
    padding:44px 38px 38px; max-width:540px; width:100%; text-align:center;
    box-shadow:0 30px 70px -40px rgba(18,48,44,.35);
  }
  .mark{width:56px;height:56px;margin:0 auto 22px;display:block;border-radius:12px}
  .code{font-size:.82rem;font-weight:800;color:var(--amber-tx);margin:0 0 10px}
  h1{font-size:clamp(2rem,6vw,2.7rem);font-weight:900;letter-spacing:-.04em;line-height:1.04;
    margin:0 0 14px;color:var(--teal)}
  h1 span{display:block;color:var(--amber-dp)}
  p.lede{color:var(--ink-soft);font-size:1.02rem;margin:0 auto 26px;max-width:38ch}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:50px;
    padding:0 1.7rem;border-radius:999px;text-decoration:none;font-weight:800;font-size:1rem;
    background:var(--honey);color:#1B1406;border:0;line-height:1.2;
    transition:background .18s ease;
  }
  a.btn:hover{background:var(--amber)}
  a.btn.dark{background:var(--teal);color:var(--cream)}
  a.btn.dark:hover{background:var(--forest)}
  .fine{font-size:.88rem;color:var(--ink-soft);margin:26px 0 0}
  .fine a{color:var(--amber-tx);text-underline-offset:3px;font-weight:700}
  @media(max-width:480px){.card{padding:34px 22px 30px;border-radius:22px}}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 1932 1932" aria-hidden="true"><rect width="1932" height="1932" rx="360" fill="#02554D"/><rect x="476" y="533" width="978" height="164" rx="82" fill="#F6F2E7"/><rect x="476" y="884" width="754" height="164" rx="82" fill="#E8843A"/><rect x="476" y="1231" width="978" height="164" rx="82" fill="#F6F2E7"/></svg>
    <p class="code">Error 404</p>
    <h1>This page<span>isn't here</span></h1>
    <p class="lede">The link may be old, or we may have moved the page. Everything about Elderly starts from the home page.</p>
    <div class="row">
      <a class="btn" href="/">Go to the home page</a>
      <a class="btn dark" href="/ingresar">Sign in</a>
    </div>
    <p class="fine">Stuck? Write to <a href="mailto:hello@callelderly.com">hello@callelderly.com</a> and a person answers.</p>
  </main>
</body>
</html>
