<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Page not found · Elderly</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    color-scheme:light;
    --bg:#FAF5EB; --card:#FFFFFF; --ink:#1C332D; --muted:#5A6560;
    --line:#E7DECA; --brand:#175045; --brand-ink:#FDFBF5; --accent:#2E7D6B;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:grid; place-items:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:38px 34px; max-width:520px; width:100%; text-align:center;
    box-shadow:0 1px 2px rgba(28,51,45,.05), 0 10px 30px rgba(28,51,45,.08);
  }
  .mark{width:52px;height:52px;margin:0 auto 18px;display:block}
  .code{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-family:var(--serif);font-size:27px;line-height:1.2;margin:0 0 10px;font-weight:600}
  p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 auto 22px;max-width:40ch}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:46px;
    padding:0 20px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;
    background:var(--brand); color:var(--brand-ink); border:1px solid var(--brand);
  }
  a.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .fine{font-size:13px;margin:20px 0 0}
  .fine a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#1D4A3E"/><path fill="#F1ECDE" transform="translate(11.5,11.5) scale(1.55)" d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58z"/></svg>
    <p class="code">Error 404</p>
    <h1>This page isn't here</h1>
    <p>The link may be old, or we may have moved the page. Everything about Elderly starts from the home page.</p>
    <div class="row">
      <a class="btn" href="/">Go to the home page</a>
      <a class="btn ghost" href="/ingresar">Sign in</a>
    </div>
    <p class="fine">Stuck? Write to <a href="mailto:hello@callelderly.com">hello@callelderly.com</a> and a person answers.</p>
  </main>
</body>
</html>
